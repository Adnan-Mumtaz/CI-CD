name: CI-CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.MY_DOCKER_USERNAME }}
          password: ${{ secrets.MY_DOCKER_PWD }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.MY_DOCKER_USERNAME }}/ci-cd:latest .

      - name: Push Docker image
        run: docker push ${{ secrets.MY_DOCKER_USERNAME }}/ci-cd:latest
